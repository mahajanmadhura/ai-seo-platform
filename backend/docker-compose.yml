version: '3.8'

services:
  db:
    image: postgres:15
    container_name: seo_postgres
    restart: always
    environment:
      POSTGRES_DB: seo_db
      POSTGRES_USER: seo_user
      POSTGRES_PASSWORD: seo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: seo_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: